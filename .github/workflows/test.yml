name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run build:production
      - run: python scripts/check.py --production
      - run: npm run test:js
      - run: python -B -m unittest discover -s tests -v
      - name: Verify preview stays outside the index
        run: |
          VERCEL_ENV=preview npm run build:production
          python scripts/check.py --preview
